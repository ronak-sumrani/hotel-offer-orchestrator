# Full stack: Temporal (CLI dev server) + Redis + API + Temporal worker.
# `docker compose up --build` is all that is needed.
name: hotel-offer-orchestrator

# Shared by api and worker: one image, different commands. Only api has `build:`
# (two services with `build:` export the same tag twice); the worker reuses the tag.
x-app: &app
  image: hotel-offer-orchestrator:local
  init: true # tini as PID 1: forwards signals, so SIGTERM works even before handlers are installed
  restart: unless-stopped
  stop_grace_period: 15s # API force-exits at 10s; worker needs 10s shutdownGraceTime + cleanup
  depends_on:
    temporal:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  REDIS_URL: redis://redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: hotel-offers
  # Mock suppliers are served by the api container.
  SUPPLIER_BASE_URL: http://api:3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
  PARTIAL_CACHE_TTL_SECONDS: ${PARTIAL_CACHE_TTL_SECONDS:-30}

services:
  temporal:
    # Temporal CLI dev server (single process, in-memory, Web UI included).
    image: temporalio/temporal:1.10.1
    # --ip 0.0.0.0 is required so the published ports are reachable from outside the container.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC frontend
      - "8233:8233" # Web UI
    healthcheck:
      # Exec form: the image ships the temporal binary; defaults to 127.0.0.1:7233.
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pure cache: RDB snapshots and AOF disabled, nothing persisted to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *app
    build: .
    # Default image CMD: node dist/api/server.js
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      PORT: 3000
      # Supplier-down flags belong on the api (it serves the mock endpoints).
      SUPPLIER_A_DOWN: ${SUPPLIER_A_DOWN:-false}
      SUPPLIER_B_DOWN: ${SUPPLIER_B_DOWN:-false}
    healthcheck:
      # Slim image has no curl; liveness only (no dependency checks).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    # Built by the api service; never try to pull this local tag from a registry.
    pull_policy: never
    command: ["node", "dist/temporal/worker.js"]
    environment:
      <<: *app-env
