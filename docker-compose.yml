# Infrastructure for local development: Temporal (CLI dev server) + Redis.
# The api and worker services are added in Phase 9.
name: hotel-offer-orchestrator

services:
  temporal:
    # Temporal CLI dev server (single process, in-memory, Web UI included).
    image: temporalio/temporal:1.10.1
    # --ip 0.0.0.0 is required so the published ports are reachable from outside the container.
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC frontend
      - "8233:8233" # Web UI
    healthcheck:
      # Exec form: the image ships the temporal binary; defaults to 127.0.0.1:7233.
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pure cache: RDB snapshots and AOF disabled, nothing persisted to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
